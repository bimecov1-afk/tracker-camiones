services:
  - type: web
    name: tracker-camiones-api
    runtime: python
    rootDir: backend
    plan: free            # para el piloto, cambiar a starter (no se suspende)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: America/Lima
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MIN
        value: "720"
      - key: USUARIOS
        sync: false
      - key: PLACAS_PIN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: CALLMEBOT_DESTINATARIOS
        sync: false
      - key: SIN_GPS_MIN
        value: "20"
      - key: CRON_KEY
        generateValue: true
